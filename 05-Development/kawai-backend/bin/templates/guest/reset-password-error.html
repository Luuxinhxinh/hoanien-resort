<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi đường dẫn - HOANIEN Retreat & Resort</title>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfcfc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .error-card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border-top: 4px solid #dc3545;
        }
        .brand {
            font-family: 'EB Garamond', serif;
            font-size: 32px;
            font-style: italic;
            color: #d4af37;
            margin-bottom: 20px;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .btn-primary {
            background-color: #1a1a1a;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 500;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="brand">Hòa Niên</div>
    <div class="icon">⚠️</div>
    <h4 class="mb-3" style="font-weight: 600;">Liên kết không hợp lệ</h4>
    <p class="text-muted" th:text="${error}">Đường link đã hết hạn hoặc không tồn tại.</p>
    
    <a href="/booking?login=true" class="btn-primary">Quay lại trang Đăng nhập</a>
</div>

</body>
</html>
