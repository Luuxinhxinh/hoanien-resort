<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lỗi - HOANIEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #1e1a19;
            color: #f1ebe3;
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
        }

        h1 {
            color: #ff6b6b;
            font-size: 24px;
            margin-bottom: 16px;
        }

        h2 {
            color: #ffaa5c;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 4px;
        }

        .value {
            font-size: 14px;
            color: #f1ebe3;
            margin-bottom: 16px;
            word-break: break-all;
        }

        pre {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 16px;
            font-size: 12px;
            color: #ff9999;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        a {
            color: #f1ebe3;
            text-decoration: underline;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="error-card">
        <h1>⚠️ Đã xảy ra lỗi</h1>
        <h2 th:text="${errorType}">Exception</h2>

        <div class="label">Đường dẫn lỗi:</div>
        <div class="value" th:text="${requestUri}">/order-food</div>

        <div class="label">Thông báo lỗi chi tiết:</div>
        <div class="value" th:text="${errorMessage}" style="color:#ff6b6b; font-weight:600;">Error message</div>

        <div class="label">Stack Trace (com.kawai.*):</div>
        <pre th:text="${stackTrace}">Stack trace...</pre>

        <div style="margin-top: 24px; text-align: center;">
            <a href="/">← Quay về trang chủ</a>
            &nbsp;&nbsp;|&nbsp;&nbsp;
            <a href="javascript:history.back()">← Quay lại trang trước</a>
        </div>
    </div>
</body>

</html>
