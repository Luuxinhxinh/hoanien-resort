<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.th3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Hoanien Retreat Resort</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f0e8 0%, #e8dfd3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .forgot-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-dot {
            width: 48px;
            height: 48px;
            background: #8B5E3C;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #2c2416;
            font-weight: 600;
        }

        .brand p {
            font-size: 13px;
            color: #8B7355;
            margin-top: 4px;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #2c2416;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #8B7355;
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #5c4a32;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d4c4b0;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            background: #faf8f5;
        }

        input:focus {
            outline: none;
            border-color: #8B5E3C;
            box-shadow: 0 0 0 3px rgba(139, 94, 60, 0.1);
            background: white;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #8B5E3C;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #6d4c31;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 94, 60, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #8B7355;
        }

        .back-link a {
            color: #8B5E3C;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .alert-success {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #166534;
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }

        .token-display {
            background: #f5f0e8;
            border: 1px dashed #8B5E3C;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            font-size: 12px;
            word-break: break-all;
            color: #5c4a32;
        }

        .token-display strong {
            display: block;
            margin-bottom: 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body>
    <div class="forgot-container">
        <div class="brand">
            <div class="brand-dot">◆</div>
            <h1>HOANIEN</h1>
            <p>Retreat Resort & Hub</p>
        </div>

        <h2>Quên mật khẩu</h2>
        <p class="subtitle">Nhập email của bạn để nhận link đặt lại mật khẩu</p>

        <!-- Flash Messages -->
        <div th:if="${authSuccess}" class="alert alert-success" role="alert">
            <span th:text="${authSuccess}"></span>
            <div th:if="${resetToken}" class="token-display">
                <strong>🔑 Demo Token (15 phút):</strong>
                <span th:text="${resetToken}"></span><br>
                <a th:href="@{'/auth/reset-password?token=' + ${resetToken}}"
                    style="color: #8B5E3C; margin-top: 8px; display: inline-block;">
                    → Click here to reset password
                </a>
            </div>
        </div>
        <div th:if="${authError}" class="alert alert-error" role="alert">
            <span th:text="${authError}"></span>
        </div>

        <form th:action="@{/auth/forgot-password}" method="post" class="space-y-4">
            <div class="form-group">
                <label for="email">Email đăng ký</label>
                <input type="email" id="email" name="email" required placeholder="Nhập email của bạn"
                    class="w-full border border-hoanien-text/20 p-3 focus:ring-1 focus:ring-hoanien-text focus:border-hoanien-text bg-white text-sm">
            </div>
            <button type="submit"
                class="btn-submit w-full bg-hoanien-text text-white py-3 text-[11px] uppercase tracking-[0.15em] font-semibold hover:bg-hoanien-text/80 active:scale-[0.98] active:translate-y-[0.5px] transition-all duration-200 transition-colors">
                Gửi link đặt lại mật khẩu
            </button>
        </form>

        <div class="back-link">
            <a href="/auth/login">← Quay lại đăng nhập</a>
        </div>
    </div>
</body>

</html>
