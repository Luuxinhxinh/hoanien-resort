<aside class="adm-sidebar" th:fragment="sidebar(activePage, activeTab)">
    <!-- Logo Area -->
    <div class="adm-sidebar-logo">
        <div class="adm-sidebar-brand">
            <div class="adm-sidebar-dot">✦</div>
            <span class="adm-sidebar-brand-name">Hoanien Retreat</span>
        </div>
        <h1 class="adm-sidebar-title">Core Operations</h1>
    </div>

    <!-- Nav -->
    <nav class="adm-nav">
                <!-- 0. Dashboard Group -->
        <div class="adm-nav-item">
            <a href="/admin/dashboard" class="adm-nav-link" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                <span class="adm-nav-icon"><i data-lucide="layout-dashboard"></i></span>
                <span class="adm-nav-label">Dashboard</span>
            </a>
        </div>
        
        <!-- 1. Master Data Group -->
        <div sec:authorize="hasAnyAuthority('OP_MASTER_DATA', 'OP_ROOM', 'OP_FNB', 'ROLE_ADMIN', 'OP_TOUR')" class="adm-nav-group-title" style="padding: 10px 16px 4px 16px; font-size: 10.5px; font-weight: 700; color: #C9A96E; text-transform: uppercase; letter-spacing: 0.12em; font-family: var(--font-sans);">Master Data</div>
        <div sec:authorize="hasAnyAuthority('OP_MASTER_DATA', 'OP_ROOM', 'ROLE_ADMIN')" class="adm-nav-item">
            <a href="/admin/master-data?tab=Rooms" class="adm-nav-link" th:classappend="${activePage == 'master-data' && (activeTab == 'Rooms' || activeTab == 'Room Categories' || activeTab == 'Pricing Management')} ? 'active' : ''">
                <span class="adm-nav-icon"><i data-lucide="bed-double"></i></span>
                <span class="adm-nav-label">Phòng & Vị trí</span>
            </a>
        </div>
        <div sec:authorize="hasAnyAuthority('OP_MASTER_DATA', 'OP_FNB', 'ROLE_ADMIN')" class="adm-nav-item">
            <a href="/admin/master-data?tab=Restaurant Menu" class="adm-nav-link" th:classappend="${activePage == 'master-data' && (activeTab == 'Restaurant Menu' || activeTab == 'Menu Categories' || activeTab == 'F&B Orders')} ? 'active' : ''">
                <span class="adm-nav-icon"><i data-lucide="utensils-crossed"></i></span>
                <span class="adm-nav-label">Menu & Nhà hàng</span>
            </a>
        </div>
        <div sec:authorize="hasAnyAuthority('OP_MASTER_DATA', 'OP_TOUR', 'ROLE_ADMIN')" class="adm-nav-item">
            <a href="/admin/master-data?tab=Tours" class="adm-nav-link" th:classappend="${activePage == 'master-data' && (activeTab == 'Tours' || activeTab == 'Tour Categories' || activeTab == 'Tour Schedules')} ? 'active' : ''">
                <span class="adm-nav-icon"><i data-lucide="map"></i></span>
                <span class="adm-nav-label">Tour & Lịch trình</span>
            </a>
        </div>

        <!-- 2. Luồng Vận Hành Group -->
        <div sec:authorize="hasAnyAuthority('OP_WORKFLOW', 'ROLE_ADMIN')" class="adm-nav-group-title" style="padding: 12px 16px 4px 16px; font-size: 10.5px; font-weight: 700; color: #C9A96E; text-transform: uppercase; letter-spacing: 0.12em; font-family: var(--font-sans);">Luồng vận hành</div>
        <div sec:authorize="hasAnyAuthority('OP_WORKFLOW', 'ROLE_ADMIN')" class="adm-nav-item">
            <a href="/admin/workflows" class="adm-nav-link" th:classappend="${activePage == 'workflows'} ? 'active' : ''">
                <span class="adm-nav-icon"><i data-lucide="play-circle"></i></span>
                <span class="adm-nav-label">Kích hoạt luồng</span>
            </a>
        </div>
        <div class="adm-nav-item">
            <a href="/admin/cronjobs" class="adm-nav-link" th:classappend="${activePage == 'cronjobs'} ? 'active' : ''">
                <span class="adm-nav-icon"><i data-lucide="cpu"></i></span>
                <span class="adm-nav-label">Giám sát Job/Cronjob</span>
            </a>
        </div>

        <!-- 3. Bảo Mật & Hệ Thống Group -->
        <div sec:authorize="hasAnyAuthority('OP_AUDIT_LOG', 'OP_MAINTENANCE', 'ROLE_ADMIN')" class="adm-nav-group-title" style="padding: 12px 16px 4px 16px; font-size: 10.5px; font-weight: 700; color: #C9A96E; text-transform: uppercase; letter-spacing: 0.12em; font-family: var(--font-sans);">Bảo mật & Hệ thống</div>
        <div sec:authorize="hasAuthority('ROLE_ADMIN')" class="adm-nav-item">
            <a href="/admin/master-data?tab=Role Management" class="adm-nav-link" th:classappend="${activePage == 'master-data' && activeTab == 'Role Management'} ? 'active' : ''">
                <span class="adm-nav-icon"><i data-lucide="key-round"></i></span>
                <span class="adm-nav-label">Phân quyền RBAC</span>
            </a>
        </div>
        <div sec:authorize="hasAnyAuthority('OP_AUDIT_LOG', 'ROLE_ADMIN')" class="adm-nav-item">
            <a href="/admin/audit-log" class="adm-nav-link" th:classappend="${activePage == 'audit-log'} ? 'active' : ''">
                <span class="adm-nav-icon"><i data-lucide="clipboard-list"></i></span>
                <span class="adm-nav-label">Audit Log</span>
            </a>
        </div>
        <div class="adm-nav-item">
            <a href="/admin/devices" class="adm-nav-link" th:classappend="${activePage == 'devices'} ? 'active' : ''">
                <span class="adm-nav-icon"><i data-lucide="smartphone"></i></span>
                <span class="adm-nav-label">Quản lý thiết bị</span>
            </a>
        </div>

        <!-- 4. Khách Hàng & Ưu Đãi Group -->
        <div sec:authorize="hasAnyAuthority('OP_CRM', 'OP_PROMOTIONS', 'ROLE_ADMIN')" class="adm-nav-group-title" style="padding: 12px 16px 4px 16px; font-size: 10.5px; font-weight: 700; color: #C9A96E; text-transform: uppercase; letter-spacing: 0.12em; font-family: var(--font-sans);">Khách hàng & Ưu đãi</div>
        <div sec:authorize="hasAnyAuthority('OP_CRM', 'ROLE_ADMIN')" class="adm-nav-item">
            <a href="/admin/master-data?tab=Account Management" class="adm-nav-link" th:classappend="${activePage == 'master-data' && activeTab == 'Account Management'} ? 'active' : ''">
                <span class="adm-nav-icon"><i data-lucide="user-square-2"></i></span>
                <span class="adm-nav-label">Hồ sơ CRM</span>
            </a>
        </div>
        <div sec:authorize="hasAnyAuthority('OP_PROMOTIONS', 'ROLE_ADMIN')" class="adm-nav-item">
            <a href="/admin/master-data?tab=Promotions" class="adm-nav-link" th:classappend="${activePage == 'master-data' && activeTab == 'Promotions'} ? 'active' : ''">
                <span class="adm-nav-icon"><i data-lucide="ticket"></i></span>
                <span class="adm-nav-label">Cấu hình Giảm giá</span>
            </a>
        </div>
    </nav>

    <!-- Footer Area -->
    <div class="adm-sidebar-footer">
        <!-- Module Switcher for RBAC cross-navigation -->
        <div class="module-switcher" sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_MANAGER', 'ROLE_RECEPTIONIST', 'ROLE_FB_STAFF', 'BOOKING', 'FNB', 'MASTER_DATA')" style="padding: 0 16px 16px 16px;">
            <select onchange="if(this.value) window.location.href=this.value" style="width: 100%; padding: 8px; border-radius: 6px; background: rgba(255,255,255,0.05); color: #c9a96e; border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 500; outline: none; cursor: pointer; font-family: 'Inter', sans-serif;">
                <option value="" disabled selected>-- Chuyển phân hệ --</option>
                <option sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_MANAGER', 'MASTER_DATA', 'OP_MASTER_DATA')" value="/admin/dashboard">Core Operations (Admin)</option>
                <option sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_MANAGER', 'ROLE_RECEPTIONIST', 'BOOKING', 'RECEPTION_CHECKIN')" value="/receptionist/dashboard">Receptionist (Lễ tân)</option>
                <option sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_MANAGER', 'ROLE_FB_STAFF', 'FNB', 'FNB_ORDER')" value="/fbStaff/dashboard">F&amp;B POS (Nhà hàng)</option>
            </select>
        </div>

        <div class="adm-sidebar-user">
            <div class="adm-sidebar-avatar" th:text="${#authentication != null ? #strings.substring(#authentication.name, 0, 2).toUpperCase() : 'AD'}">AD</div>
            <div>
                <div class="adm-sidebar-name" th:text="${#authentication != null ? #authentication.name : 'Admin Dũng'}">Admin Dũng</div>
                <div class="adm-sidebar-role" th:text="${#authentication != null and #authentication.authorities != null and !#authentication.authorities.isEmpty() ? #strings.replace(#authentication.authorities[0].authority, 'ROLE_', '') : 'Super Admin'}">Super Admin</div>
            </div>
        </div>
    </div>
</aside>
