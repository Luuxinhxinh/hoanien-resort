<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- TABLE FRAGMENT -->
<div th:fragment="table">
    <div class="adm-table-wrap">
        <table class="adm-table">
            <thead>
            <tr>
                <th>Mã</th><th>Mã giảm giá</th><th>Loại</th><th>Giá trị</th><th>Áp dụng cho</th><th>Lượt dùng</th><th>Hết hạn</th><th>Trạng thái</th><th style="text-align:right">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row, stat : ${rows}" th:attr="data-id=${row['id']},data-entity=${row['jsonString']}">
                <td th:attr="data-key='id',data-value=${row['id']}" th:text="${row['id']}"></td>
                <td th:attr="data-key='code',data-value=${row['code']}">
                    <span class="cell-code" th:text="${row['code']}"></span>
                </td>
                <td th:attr="data-key='type',data-value=${row['type']}">
                    <span class="cell-badge" th:classappend="${row['__typeStyle']}" th:text="${row['type']}"></span>
                </td>
                <td th:attr="data-key='value',data-value=${row['value']}" th:text="${row['value']}"></td>
                <td th:attr="data-key='scope',data-value=${row['scope']}">
                    <span class="cell-badge" th:classappend="${row['__scopeStyle']}" th:text="${row['scope']}"></span>
                </td>
                <td th:attr="data-key='uses',data-value=${row['uses']}" th:text="${row['uses']}"></td>
                <td th:attr="data-key='expires',data-value=${row['expires']}" th:text="${row['expires']}"></td>
                <td th:attr="data-key='status',data-value=${row['status']}">
                    <span class="cell-badge" th:classappend="${row['__statusStyle']}" th:text="${row['status']}"></span>
                </td>
                <td style="text-align:center;">
                    <button type="button" class="btn-toggle" th:attr="data-id=${row['id']},data-value=${row['status']}">
                        <i th:if="${row['status'] == 'Active' || row['status'] == 'Available' || row['status'] == 'true'}" data-lucide="toggle-right" style="color:#C9A96E"></i>
                        <i th:unless="${row['status'] == 'Active' || row['status'] == 'Available' || row['status'] == 'true'}" data-lucide="toggle-left" style="color:#8B7355"></i>
                    </button>
                </td>
                <td style="text-align:right">
                    <div style="display:flex;align-items:center;justify-content:flex-end;gap:2px">
                        <button class="btn-action btn-action-edit btn-edit" th:attr="data-id=${row['id']}"><i data-lucide="pencil"></i></button>
</div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(rows)}"><td colspan="9" style="text-align:center;padding:48px;color:#8B7355;font-family:var(--font-serif);font-size:18px">Không có bản ghi nào</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- FORM FRAGMENT -->
<div th:fragment="form">
    <div class="form-fields-inner" style="display:flex;flex-direction:column;gap:20px">
        <div class="adm-form-group"><label class="adm-form-label">Mã giảm giá <span style="color:#B45309">*</span></label><input type="text" name="code" class="adm-form-input" required></div>
        <div class="adm-form-group"><label class="adm-form-label">Loại</label>
            <select name="discountType" class="adm-form-select">
                <option value="Phần trăm">Phần trăm</option>
                <option value="Số tiền">Số tiền</option>
            </select>
        </div>
        <div class="adm-form-group"><label class="adm-form-label">Giá trị <span style="color:#B45309">*</span></label><input type="text" name="value" class="adm-form-input" required></div>
        <div class="adm-form-group"><label class="adm-form-label">Ngày bắt đầu</label><input type="datetime-local" name="validFrom" class="adm-form-input"></div>
        <div class="adm-form-group"><label class="adm-form-label">Ngày hết hạn</label><input type="date" name="validTo" class="adm-form-input"></div>
        <div class="adm-form-group"><label class="adm-form-label">Số lượt dùng tối đa</label><input type="number" name="maxUses" class="adm-form-input"></div>
        <div class="adm-form-group"><label class="adm-form-label">Cấu hình Combo</label><input type="text" name="comboConfig" class="adm-form-input" placeholder="Ví dụ: ROOM+FB"></div>
        <div class="adm-form-group"><label class="adm-form-label">Mô tả Khuyến Mãi</label><textarea name="description" class="adm-form-input" rows="3"></textarea></div>
        
        <!-- Thiết lập hạn mức bảo mật (Security Threshold Settings) -->
        <div style="border-top: 1px solid rgba(44,42,30,0.1); padding-top: 16px; margin-top: 8px;">
            <h3 style="font-size: 14px; font-weight: 700; color: #8B7355; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em;">Thiết lập hạn mức bảo mật (Anti-Fraud)</h3>
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <div class="adm-form-group">
                    <label class="adm-form-label">Hạn mức giảm tối đa (VND)</label>
                    <input type="number" name="maxDiscountValueVnd" class="adm-form-input" placeholder="Ví dụ: 1000000" min="0">
                </div>
                <div class="adm-form-group">
                    <label class="adm-form-label">Giới hạn lượt dùng tối đa / Khách hàng</label>
                    <input type="number" name="maxUsesPerCustomer" class="adm-form-input" placeholder="Ví dụ: 1" min="1">
                </div>
                <div class="adm-form-group">
                    <label class="adm-form-label">Ngưỡng duyệt của Quản lý (%)</label>
                    <input type="number" name="managerApprovalThresholdPct" class="adm-form-input" placeholder="Ví dụ: 25" min="0" max="100">
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
