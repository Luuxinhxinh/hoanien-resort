<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- TABLE FRAGMENT -->
    <div th:fragment="table">
        <style>
            .rbac-perm-badge {
                display: inline-flex;
                align-items: center;
                padding: 4px 10px;
                background-color: #fcf9f2;
                border: 1px solid #e2d1b3;
                color: #8b6d3b;
                border-radius: 20px;
                font-size: 11.5px;
                font-weight: 600;
                letter-spacing: 0.02em;
                box-shadow: 0 1px 2px rgba(139,109,59,0.05);
            }
            .rbac-perm-badge.sys {
                background-color: #fdf5f5;
                border-color: #f5c6c6;
                color: #c94f4f;
            }
            .rbac-role-name {
                font-weight: 600;
                color: #4a3b2c;
                font-size: 14px;
            }
            .rbac-empty-perm {
                font-size: 12px;
                color: #a09384;
                font-style: italic;
                background: #f5f5f5;
                padding: 4px 10px;
                border-radius: 20px;
                border: 1px dashed #ddd;
            }
        </style>
        <div class="adm-table-wrap">
            <table class="adm-table">
                <thead>
                    <tr>
                        <th style="width: 80px">Mã</th>
                        <th style="width: 220px">Tên vai trò</th>
                        <th>Quyền hiện tại (Permissions)</th>
                        <th style="text-align:right; width: 100px">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row, stat : ${rows}" th:attr="data-id=${row['id']},data-entity=${row['jsonString']}">
                        <td th:attr="data-key='id',data-value=${row['id']}" th:text="${'R-' + row['id']}" style="color: #8b7355; font-family: monospace; font-size: 13px;"></td>
                        <td th:attr="data-key='name',data-value=${row['name']}">
                            <div class="rbac-role-name" th:text="${row['name']}"></div>
                        </td>
                        <td th:attr="data-key='permissions',data-value=${row['permissions']}">
                            <div style="display:flex;flex-wrap:wrap;gap:6px;max-width:550px">
                                <th:block th:if="${row['permissions'] != null and !row['permissions'].isEmpty()}">
                                    <th:block th:each="perm : ${#strings.arraySplit(row['permissions'], ',')}">
                                        <span class="rbac-perm-badge" 
                                              th:classappend="${#strings.trim(perm) == 'MASTER_DATA' or #strings.trim(perm) == 'AUDIT_LOG' ? 'sys' : ''}" 
                                              th:text="${#strings.trim(perm)}"></span>
                                    </th:block>
                                </th:block>
                                <span th:if="${row['permissions'] == null or row['permissions'].isEmpty()}" 
                                      class="rbac-empty-perm">Chưa gán quyền</span>
                            </div>
                        </td>
                        <td style="text-align:right">
                            <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px">
                                <th:block th:if="${#strings.toUpperCase(row['name']) != 'ADMIN'}">
                                    <button class="btn-action btn-action-edit btn-edit" th:attr="data-id=${row['id']}" title="Chỉnh sửa quyền">
                                        <i data-lucide="shield-check"></i>
                                    </button>
                                    <button class="btn-action btn-action-delete btn-delete"
                                        th:attr="data-id=${row['id']}" title="Xóa vai trò">
                                        <i data-lucide="trash-2"></i>
                                    </button>
                                </th:block>
                                <th:block th:if="${#strings.toUpperCase(row['name']) == 'ADMIN'}">
                                    <span style="color: #999; font-size: 12px; display:flex; align-items:center; gap: 4px; padding-right: 4px;" title="Vai trò hệ thống không thể sửa">
                                        <i data-lucide="lock" style="width: 14px; height: 14px;"></i> Hệ thống
                                    </span>
                                </th:block>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td colspan="4"
                            style="text-align:center;padding:48px;color:#8B7355;font-family:var(--font-serif);font-size:16px">
                            Chưa có dữ liệu vai trò</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- FORM FRAGMENT -->
    <div th:fragment="form">
        <div class="form-fields-inner" style="display:flex;flex-direction:column;gap:24px">

            <div class="adm-form-group">
                <label class="adm-form-label">Tên vai trò <span style="color:#B45309">*</span></label>
                <input type="text" name="name" id="role-name-input" class="adm-form-input" required
                       placeholder="VD: Receptionist, F&B Kitchen, Housekeeping...">
            </div>

            <div class="adm-form-group">
                <label class="adm-form-label" style="margin-bottom:12px">Các quyền hạn (Permissions)</label>

                <!-- OPS CORE -->
                <div class="perm-section-title" style="margin-bottom:10px;font-size:11px;font-weight:700;color:#C9A96E;text-transform:uppercase;letter-spacing:0.1em">
                    Nghiệp vụ cài lõi
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#f9f6f0">
                        <input type="checkbox" class="perm-checkbox" value="DASHBOARD" style="width:15px;height:15px;accent-color:#C9A96E"> Dashboard Tổng Quan
                    </label>


                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#f9f6f0">
                        <input type="checkbox" class="perm-checkbox" value="FNB" style="width:15px;height:15px;accent-color:#C9A96E"> F&amp;B (Nhà hàng / Bếp)
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#f9f6f0">
                        <input type="checkbox" class="perm-checkbox" value="TOUR" style="width:15px;height:15px;accent-color:#C9A96E"> Tour &amp; Hướng dẫn viên
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#f9f6f0">
                        <input type="checkbox" class="perm-checkbox" value="HOUSEKEEPING" style="width:15px;height:15px;accent-color:#C9A96E"> Buồng phòng
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#f9f6f0">
                        <input type="checkbox" class="perm-checkbox" value="MAINTENANCE" style="width:15px;height:15px;accent-color:#C9A96E"> Bảo trì &amp; Sự cố
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#f9f6f0">
                        <input type="checkbox" class="perm-checkbox" value="NIGHT_AUDIT" style="width:15px;height:15px;accent-color:#C9A96E"> Đêm kiểm (Night Audit)
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#eef6ff">
                        <input type="checkbox" class="perm-checkbox" value="RECEPTION_CHECKIN" style="width:15px;height:15px;accent-color:#C9A96E"> FO Check-in
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#eef6ff">
                        <input type="checkbox" class="perm-checkbox" value="RECEPTION_CHECKOUT" style="width:15px;height:15px;accent-color:#C9A96E"> FO Check-out
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#eef6ff">
                        <input type="checkbox" class="perm-checkbox" value="RECEPTION_WALKIN" style="width:15px;height:15px;accent-color:#C9A96E"> FO Walk-in
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#eef6ff">
                        <input type="checkbox" class="perm-checkbox" value="RECEPTION_INHOUSE" style="width:15px;height:15px;accent-color:#C9A96E"> FO In-house
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#fdf2e9">
                        <input type="checkbox" class="perm-checkbox" value="FNB_ORDER" style="width:15px;height:15px;accent-color:#C9A96E"> F&amp;B Order
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#fdf2e9">
                        <input type="checkbox" class="perm-checkbox" value="FNB_TABLE" style="width:15px;height:15px;accent-color:#C9A96E"> F&amp;B Table
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#fdf2e9">
                        <input type="checkbox" class="perm-checkbox" value="FNB_ROOM_SERVICE" style="width:15px;height:15px;accent-color:#C9A96E"> F&amp;B Room Service
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#fdf2e9">
                        <input type="checkbox" class="perm-checkbox" value="FNB_REPORT" style="width:15px;height:15px;accent-color:#C9A96E"> F&amp;B Report
                    </label>
                </div>

                <!-- MANAGEMENT -->
                <div class="perm-section-title" style="margin-bottom:10px;font-size:11px;font-weight:700;color:#C9A96E;text-transform:uppercase;letter-spacing:0.1em">
                    Quản lý &amp; Báo cáo
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#f9f6f0">
                        <input type="checkbox" class="perm-checkbox" value="ANALYTICS" style="width:15px;height:15px;accent-color:#C9A96E"> Báo cáo &amp; Phân tích
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#f9f6f0">
                        <input type="checkbox" class="perm-checkbox" value="REVIEWS" style="width:15px;height:15px;accent-color:#C9A96E"> Quản lý Đánh giá
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#f9f6f0">
                        <input type="checkbox" class="perm-checkbox" value="PROMOTIONS" style="width:15px;height:15px;accent-color:#C9A96E"> Mã giảm giá
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#f9f6f0">
                        <input type="checkbox" class="perm-checkbox" value="CRM" style="width:15px;height:15px;accent-color:#C9A96E"> Hồ sơ KH (CRM)
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#f9f6f0">
                        <input type="checkbox" class="perm-checkbox" value="WORKFLOW" style="width:15px;height:15px;accent-color:#C9A96E"> Quy trình (Workflow)
                    </label>
                </div>

                <!-- ADMIN ONLY -->
                <div class="perm-section-title" style="margin-bottom:10px;font-size:11px;font-weight:700;color:#C9A96E;text-transform:uppercase;letter-spacing:0.1em">
                    Hệ thống (chỉ Admin)
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#fff5f5">
                        <input type="checkbox" class="perm-checkbox" value="MASTER_DATA" style="width:15px;height:15px;accent-color:#C9A96E"> Cấu hình Master Data
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px;border-radius:6px;background:#fff5f5">
                        <input type="checkbox" class="perm-checkbox" value="AUDIT_LOG" style="width:15px;height:15px;accent-color:#C9A96E"> Audit Log Monitor
                    </label>
                </div>

                <input type="hidden" name="permissions" id="hidden-permissions-input">

                <!-- Gợi ý tự động theo tên -->
                <div style="margin-top:14px;padding:10px 12px;background:#fdf8f0;border-radius:6px;border-left:3px solid #C9A96E;font-size:12px;color:#8B7355">
                    <strong>Tip:</strong> Nhập tên vai trò (VD: "F&B Kitchen", "Receptionist") rồi nhấn nút bên cạnh để gợi ý quyền tự động.
                    <button type="button" id="btn-suggest-perms" onclick="suggestPermissions()"
                        style="margin-left:8px;padding:4px 10px;background:#C9A96E;color:#fff;border:none;border-radius:4px;font-size:12px;cursor:pointer">
                        Gợi ý tự động
                    </button>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
