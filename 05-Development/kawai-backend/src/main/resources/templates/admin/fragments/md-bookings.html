<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- TABLE FRAGMENT -->
<div th:fragment="table">
    <div class="adm-table-wrap">
        <table class="adm-table">
            <thead>
            <tr>
                <th>Mã Booking</th><th>Khách hàng</th><th>Phòng</th><th>Ngày Check-in</th><th>Ngày Check-out</th><th>Trạng thái</th><th style="text-align:right">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row, stat : ${rows}" th:attr="data-id=${row['id']},data-entity=${row['jsonString']}">
                <td th:attr="data-key='id',data-value=${row['id']}" th:text="${row['id']}"></td>
                <td th:attr="data-key='customer',data-value=${row['customer']}" th:text="${row['customer']}"></td>
                <td th:attr="data-key='room',data-value=${row['room']}" th:text="${row['room']}"></td>
                <td th:attr="data-key='checkIn',data-value=${row['checkIn']}" th:text="${row['checkIn']}"></td>
                <td th:attr="data-key='checkOut',data-value=${row['checkOut']}" th:text="${row['checkOut']}"></td>
                <td th:attr="data-key='status',data-value=${row['status']}">
                    <span class="cell-badge" th:classappend="${row['__statusStyle']}" th:text="${row['status']}"></span>
                </td>
                <td style="text-align:right">
                    <div style="display:flex;align-items:center;justify-content:flex-end;gap:2px">
                        <button class="btn-action btn-action-edit btn-edit" th:attr="data-id=${row['id']}"><i data-lucide="pencil"></i></button>
                        <button class="btn-action btn-action-delete btn-delete" th:attr="data-id=${row['id']}"><i data-lucide="trash-2"></i></button>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(rows)}"><td colspan="7" style="text-align:center;padding:48px;color:#8B7355;font-family:var(--font-serif);font-size:18px">Không có bản ghi nào</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- FORM FRAGMENT -->
<div th:fragment="form">
    <div class="form-fields-inner" style="display:flex;flex-direction:column;gap:20px">
        <div class="adm-form-group"><label class="adm-form-label">Phòng</label><input type="text" name="room" class="adm-form-input"></div>
        <div class="adm-form-group"><label class="adm-form-label">Ngày Check-in</label><input type="date" name="checkIn" class="adm-form-input"></div>
        <div class="adm-form-group"><label class="adm-form-label">Ngày Check-out</label><input type="date" name="checkOut" class="adm-form-input"></div>
        <div class="adm-form-group"><label class="adm-form-label">Trạng thái</label>
            <select name="status" class="adm-form-select">
                <option value="Pending">Pending</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Checked-in">Checked-in</option>
                <option value="Checked-out">Checked-out</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </div>
    </div>
</div>

</body>
</html>
