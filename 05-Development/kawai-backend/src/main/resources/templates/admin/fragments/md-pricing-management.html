<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- TABLE FRAGMENT -->
    <div th:fragment="table">
        <div class="adm-table-wrap">
            <table class="adm-table">
                <thead>
                    <tr>
                        <th>Mã</th>
                        <th>Hạng phòng</th>
                        <th>Loại mùa</th>
                        <th>Ngày bắt đầu</th>
                        <th>Ngày kết thúc</th>
                        <th>Giá / đêm</th>
                        <th>Trạng thái</th>
                        <th style="text-align:right">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row, stat : ${rows}" th:attr="data-id=${row['id']},data-entity=${row['jsonString']}">
                        <td th:attr="data-key='id',data-value=${row['id']}" th:text="${row['id']}"></td>
                        <td th:attr="data-key='roomCategory',data-value=${row['roomCategory']}"
                            th:text="${row['roomCategory']}"></td>
                        <td th:attr="data-key='seasonType',data-value=${row['seasonType']}">
                            <span class="cell-badge" th:classappend="${row['__seasonTypeStyle']}"
                                th:text="${row['seasonType']}"></span>
                        </td>
                        <td th:attr="data-key='startDate',data-value=${row['startDate']}" th:text="${row['startDate']}">
                        </td>
                        <td th:attr="data-key='endDate',data-value=${row['endDate']}" th:text="${row['endDate']}"></td>
                        <td th:attr="data-key='price',data-value=${row['price']}" th:text="${row['price']}"></td>
                        <td th:attr="data-key='status',data-value=${row['status']}">
                            <span class="cell-badge" th:classappend="${row['__statusStyle']}"
                                th:text="${row['status']}"></span>
                        </td>
                        <td style="text-align:right">
                            <button class="btn-action btn-action-edit btn-edit" th:attr="data-id=${row['id']}"><i
                                    data-lucide="pencil"></i></button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td colspan="8"
                            style="text-align:center;padding:48px;color:#8B7355;font-family:var(--font-serif);font-size:18px">
                            Không có bản ghi nào</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- FORM FRAGMENT -->
    <div th:fragment="form">
        <div class="form-fields-inner" style="display:flex;flex-direction:column;gap:20px">
            <div class="adm-form-group"><label class="adm-form-label">Hạng phòng <span
                        style="color:#B45309">*</span></label>
                <select name="roomCategory" class="adm-form-select">
                    <option th:each="opt : ${formOptions['roomCategories']}" th:value="${opt}" th:text="${opt}">
                    </option>
                </select>
            </div>
            <div class="adm-form-group"><label class="adm-form-label">Loại mùa</label>
                <select name="seasonType" class="adm-form-select">
                    <option th:each="opt : ${formOptions['seasonTypes']}" th:value="${opt}" th:text="${opt}"></option>
                </select>
            </div>
            <div class="adm-form-group"><label class="adm-form-label">Ngày bắt đầu</label><input type="date"
                    name="startDate" class="adm-form-input"></div>
            <div class="adm-form-group"><label class="adm-form-label">Ngày kết thúc</label><input type="date"
                    name="endDate" class="adm-form-input"></div>
            <div class="adm-form-group"><label class="adm-form-label">Giá / đêm <span
                        style="color:#B45309">*</span></label><input type="text" name="price" class="adm-form-input"
                    required></div>
        </div>
    </div>

</body>

</html>
