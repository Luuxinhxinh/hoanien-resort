<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- TABLE FRAGMENT -->
    <div th:fragment="table">
        <div class="adm-table-wrap">
            <table class="adm-table">
                <thead>
                    <tr>
                        <th>Mã Rule</th>
                        <th>Hạng phòng</th>
                        <th>Từ ngày</th>
                        <th>Đến ngày</th>
                        <th>Mức điều chỉnh</th>
                        <th>Lý do</th>
                        <th style="text-align:right">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row, stat : ${rows}" th:attr="data-id=${row['id']},data-entity=${row['jsonString']}">
                        <td th:attr="data-key='id',data-value=${row['id']}" th:text="${row['id']}"></td>
                        <td th:attr="data-key='roomCategory',data-value=${row['roomCategory']}"
                            th:text="${row['roomCategory']}"></td>
                        <td th:attr="data-key='startDate',data-value=${row['startDate']}" th:text="${row['startDate']}"></td>
                        <td th:attr="data-key='endDate',data-value=${row['endDate']}" th:text="${row['endDate']}"></td>
                        <td th:attr="data-key='priceModifier',data-value=${row['priceModifier']}" th:text="${row['priceModifier']}"></td>
                        <td th:attr="data-key='reason',data-value=${row['reason']}" th:text="${row['reason']}"></td>
                        <td style="text-align:right">
                            <button class="btn-action btn-action-edit btn-edit" th:attr="data-id=${row['id']}"><i
                                    data-lucide="pencil"></i></button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td colspan="7"
                            style="text-align:center;padding:48px;color:#8B7355;font-family:var(--font-serif);font-size:18px">
                            Không có quy tắc giá động nào</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- FORM FRAGMENT -->
    <div th:fragment="form">
        <div class="form-fields-inner" style="display:flex;flex-direction:column;gap:20px">
            <div class="adm-form-group">
                <label class="adm-form-label">Hạng phòng (ID) <span style="color:#B45309">*</span></label>
                <input type="text" name="roomCategory" class="adm-form-input" required>
            </div>
            <div style="display:flex;gap:20px;">
                <div class="adm-form-group" style="flex:1;">
                    <label class="adm-form-label">Từ ngày <span style="color:#B45309">*</span></label>
                    <input type="date" name="startDate" class="adm-form-input" required>
                </div>
                <div class="adm-form-group" style="flex:1;">
                    <label class="adm-form-label">Đến ngày <span style="color:#B45309">*</span></label>
                    <input type="date" name="endDate" class="adm-form-input" required>
                </div>
            </div>
            <div class="adm-form-group">
                <label class="adm-form-label">Điều chỉnh giá (VND) <span style="color:#B45309">*</span></label>
                <input type="number" name="priceModifier" class="adm-form-input" placeholder="VD: 500000 hoặc -200000" required>
            </div>
            <div class="adm-form-group">
                <label class="adm-form-label">Lý do / Mùa</label>
                <input type="text" name="reason" class="adm-form-input" placeholder="VD: Mùa cao điểm">
            </div>
        </div>
    </div>

</body>

</html>
