<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- TABLE FRAGMENT -->
<div th:fragment="table">
    <div class="adm-table-wrap">
        <table class="adm-table">
            <thead>
            <tr>
                <th>Mã</th><th>Tên hạng phòng</th><th>Số phòng</th><th>Giá cơ bản / đêm</th><th>Trạng thái</th><th style="text-align:center;">Kích hoạt</th><th style="text-align:right">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row, stat : ${rows}" th:attr="data-id=${row['id']},data-entity=${row['jsonString']}">
                <td th:attr="data-key='id',data-value=${row['id']}" th:text="${row['id']}"></td>
                <td th:attr="data-key='name',data-value=${row['name']}" th:text="${row['name']}"></td>
                <td th:attr="data-key='rooms',data-value=${row['rooms']}" th:text="${row['rooms']}"></td>
                <td th:attr="data-key='price',data-value=${row['price']}" th:text="${row['price']}"></td>
                <td th:attr="data-key='status',data-value=${row['status']}">
                    <span class="cell-badge" th:classappend="${row['__statusStyle']}" th:text="${row['status']}"></span>
                </td>
                <td style="text-align:center;">
                    <button type="button" class="btn-toggle" th:attr="data-id=${row['id']},data-value=${row['status']}">
                        <i th:if="${row['status'] == 'Active' || row['status'] == 'Available' || row['status'] == 'true' || row['status'] == 'Hoạt động'}" data-lucide="toggle-right" style="color:#C9A96E"></i>
                        <i th:unless="${row['status'] == 'Active' || row['status'] == 'Available' || row['status'] == 'true' || row['status'] == 'Hoạt động'}" data-lucide="toggle-left" style="color:#8B7355"></i>
                    </button>
                </td>
                <td style="text-align:right">
                    <div style="display:flex;align-items:center;justify-content:flex-end;gap:2px">
                        <button class="btn-action btn-action-edit btn-edit" th:attr="data-id=${row['id']}"><i data-lucide="pencil"></i></button>
</div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(rows)}"><td colspan="6" style="text-align:center;padding:48px;color:#8B7355;font-family:var(--font-serif);font-size:18px">Không có bản ghi nào</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- FORM FRAGMENT -->
<div th:fragment="form">
    <div class="form-fields-inner" style="display:flex;flex-direction:column;gap:20px">
        <div class="adm-form-group"><label class="adm-form-label">Tên hạng phòng <span style="color:#B45309">*</span></label><input type="text" name="name" class="adm-form-input" required></div>
        <div class="adm-form-group"><label class="adm-form-label">Sức chứa tối đa (Khách) <span style="color:#B45309">*</span></label><input type="number" name="rooms" class="adm-form-input" required></div>
        <div class="adm-form-group"><label class="adm-form-label">Giá cơ bản / đêm <span style="color:#B45309">*</span></label><input type="text" name="price" class="adm-form-input" required></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
            <div class="adm-form-group"><label class="adm-form-label">NL tiêu chuẩn</label><input type="number" name="baseAdults" class="adm-form-input"></div>
            <div class="adm-form-group"><label class="adm-form-label">TE tiêu chuẩn</label><input type="number" name="baseChildren" class="adm-form-input"></div>
            <div class="adm-form-group"><label class="adm-form-label">NL tối đa</label><input type="number" name="maxAdults" class="adm-form-input"></div>
            <div class="adm-form-group"><label class="adm-form-label">TE tối đa</label><input type="number" name="maxChildren" class="adm-form-input"></div>
            <div class="adm-form-group"><label class="adm-form-label">Phụ thu NL (VNĐ)</label><input type="text" name="extraAdultSurcharge" class="adm-form-input"></div>
            <div class="adm-form-group"><label class="adm-form-label">Phụ thu TE (Có giường) (VNĐ)</label><input type="text" name="extraChildSurcharge" class="adm-form-input"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
            <div class="adm-form-group"><label class="adm-form-label">Loại giường</label><input type="text" name="bedType" class="adm-form-input" placeholder="VD: 1 Giường King 2m2"></div>
            <div class="adm-form-group"><label class="adm-form-label">Diện tích (m2)</label><input type="number" name="roomSize" class="adm-form-input"></div>
            <div class="adm-form-group"><label class="adm-form-label">Hướng nhìn</label><input type="text" name="viewType" class="adm-form-input" placeholder="VD: Hướng Biển"></div>
            <div class="adm-form-group"><label class="adm-form-label">Dịch vụ miễn phí</label><input type="text" name="complimentaryServices" class="adm-form-input" placeholder="VD: 2 chai nước suối, Trà & Cà phê"></div>
        </div>
        <div style="display:flex; gap:20px; align-items:center;">
            <label style="display:flex; align-items:center; gap:8px; font-family:var(--font-sans); font-size:14px;"><input type="checkbox" name="hasBathtub"> Có bồn tắm</label>
            <label style="display:flex; align-items:center; gap:8px; font-family:var(--font-sans); font-size:14px;"><input type="checkbox" name="hasBalcony"> Có ban công</label>
            <label style="display:flex; align-items:center; gap:8px; font-family:var(--font-sans); font-size:14px;"><input type="checkbox" name="hasFreeBreakfast"> Bữa sáng miễn phí</label>
        </div>
        <div class="adm-form-group"><label class="adm-form-label">Mô tả hạng phòng</label><textarea name="description" class="adm-form-input" rows="3"></textarea></div>
        <div class="adm-form-group">
            <label class="adm-form-label">Link ảnh đại diện <span style="font-size: 12px; color: #666; font-weight: 400;">(Chọn nhiều ảnh, tối thiểu 3 ảnh)</span></label>
            <input type="file" id="roomCatImages" name="roomCatImages" class="adm-form-input" multiple accept="image/*">
            <input type="hidden" name="coverImgUrl" id="hiddenCoverImgUrl">
            <div id="imagePreviewContainer" style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;"></div>
        </div>
    </div>
</div>

</body>
</html>
