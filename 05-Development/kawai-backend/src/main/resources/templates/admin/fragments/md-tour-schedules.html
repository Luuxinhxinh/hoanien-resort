<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- TABLE FRAGMENT -->
<div th:fragment="table">
    <div class="adm-table-wrap">
        <table class="adm-table">
            <thead>
            <tr>
                <th>Mã Lịch</th><th>Tên Tour</th><th>Ngày khởi hành</th><th>Sĩ số</th><th>Trạng thái</th><th style="text-align:right">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row, stat : ${rows}" th:attr="data-id=${row['id']},data-entity=${row['jsonString']}">
                <td th:attr="data-key='id',data-value=${row['id']}" th:text="${row['id']}"></td>
                <td th:attr="data-key='tour',data-value=${row['tour']}" th:text="${row['tour']}"></td>
                <td th:attr="data-key='date',data-value=${row['date']}" th:text="${row['date']}"></td>
                <td th:attr="data-key='capacity',data-value=${row['capacity']}" th:text="${row['capacity']}"></td>
                <td th:attr="data-key='status',data-value=${row['status']}">
                    <span class="cell-badge" th:classappend="${row['__statusStyle']}" th:text="${row['status']}"></span>
                </td>
                <td style="text-align:right">
                    <div style="display:flex;align-items:center;justify-content:flex-end;gap:2px">
                        <button class="btn-action btn-action-edit btn-edit" th:attr="data-id=${row['id']}"><i data-lucide="pencil"></i></button>
</div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(rows)}"><td colspan="6" style="text-align:center;padding:48px;color:#8B7355;font-family:var(--font-serif);font-size:18px">Không có bản ghi nào</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- FORM FRAGMENT -->
<div th:fragment="form">
    <div class="form-fields-inner" style="display:flex;flex-direction:column;gap:20px">
        <div class="adm-form-group"><label class="adm-form-label">Tên Tour</label><input type="text" name="tour" class="adm-form-input"></div>
        <div class="adm-form-group"><label class="adm-form-label">Ngày khởi hành</label><input type="date" name="date" class="adm-form-input"></div>
        <div class="adm-form-group"><label class="adm-form-label">Trạng thái</label>
            <select name="status" class="adm-form-select">
                <option value="Open">Open</option>
                <option value="Full">Full</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
            </select>
        </div>
    </div>
</div>

</body>
</html>
