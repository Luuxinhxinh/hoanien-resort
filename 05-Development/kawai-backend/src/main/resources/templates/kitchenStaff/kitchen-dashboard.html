<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Display System | Hoanien Resort</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" th:href="@{/f&amp;bStaff/css/pos-dashboard.css}" href="../../statics/f&bStaff/css/pos-dashboard.css" />

  <link rel="stylesheet" th:href="@{/kitchenStaff/css/kitchen-dashboard.css}" href="../../statics/kitchenStaff/css/kitchen-dashboard.css" />
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="brand-name">HOANIEN</div>
      <div class="brand-sub">Resort &amp; Tour Hub</div>
      <div class="staff-badge">
        <span class="material-symbols-outlined" style="font-size:0.7rem;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;">restaurant</span>
        Kitchen Staff
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Vận hành</div>
      <a href="/kitchenStaff/kitchen" class="nav-item active">
        <span class="material-symbols-outlined">kitchen</span>
        <span>KDS Dashboard</span>
      </a>
      <a href="/kitchenStaff/emenu" th:href="@{/kitchenStaff/emenu}" class="nav-item">
        <span class="material-symbols-outlined">menu_book</span>
        <span>E-Menu</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="staff-profile">
        <div class="staff-avatar">KS</div>
        <div>
          <div class="staff-name" th:text="${staffName != null ? staffName : 'Nhân viên bếp'}">Nhân viên Bếp</div>
          <div class="staff-role">Nhà Bếp</div>
        </div>
        <button class="logout-btn" title="Đăng xuất" onclick="location.href='/auth/logout'">
          <span class="material-symbols-outlined" style="font-size:1.05rem;">logout</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <header class="topbar" id="main-topbar">
      <div>
        <div class="topbar-title" id="topbar-title-text" style="color: #000;">KITCHEN DISPLAY SYSTEM</div>
        <div class="topbar-subtitle" id="topbar-subtitle-text" style="color: rgba(0,0,0,0.7);">Màn hình Kanban cho Bếp</div>
      </div>
      <div class="topbar-right">
        <div class="topbar-clock" id="live-clock" style="color: #000;">--:--:--</div>
        <div class="icon-btn" title="Làm mới" onclick="refreshBoard()" style="color: #000; cursor: pointer;">
          <span class="material-symbols-outlined">refresh</span>
        </div>
      </div>
    </header>

    <div class="dashboard-body" style="padding: 20px; overflow-y: auto;">
      <div class="kanban-board">

    <!-- PENDING COLUMN -->
    <div class="kanban-col">
      <h2>New Orders</h2>

      <div class="order-card pending" th:each="order : ${orders}" th:if="${order.orderStatus == 'Pending'}">
        <div class="order-header">
          <span th:text="'Order #' + ${order.id}"></span>
          <span th:text="${order.orderType}"></span>
        </div>
        <div class="order-meta">
          <span th:text="${order.table != null ? 'Bàn ' + order.table.tableNumber : 'Room Service'}"></span>
        </div>
        
        <div class="order-general-note" th:if="${order.note != null and !order.note.isEmpty()}">
          <span class="material-symbols-outlined" style="font-size: 0.9rem; vertical-align: middle;">warning</span>
          <th:block th:if="${#strings.startsWith(order.note, 'GUEST:')}">
            <th:block th:with="pipeIndex=${#strings.indexOf(order.note, '|')}">
              <strong style="color: #b45309;" th:text="'Khách: ' + ${#strings.substring(order.note, 6, pipeIndex)}"></strong>
              <span th:if="${#strings.length(order.note) > pipeIndex + 1}" 
                    th:text="' - Note: ' + ${#strings.substring(order.note, pipeIndex + 1)}"></span>
            </th:block>
          </th:block>
          <th:block th:unless="${#strings.startsWith(order.note, 'GUEST:')}">
            <span th:text="'Note chung: ' + ${order.note}"></span>
          </th:block>
        </div>

        <ul class="order-items" th:id="'list-' + ${order.id}">
          <li th:each="detail : ${order.details}" th:if="${detail.kotStatus == 'Pending' || detail.kotStatus == 'Preparing'}" th:data-id="${detail.id}" onclick="toggleItem(this)">
            <div style="width: 100%; text-align: left;">
              <span th:text="${detail.quantity + 'x ' + (detail.menuItem != null ? detail.menuItem.itemName : 'Món')}"></span>
              <div class="item-note" th:if="${detail.note != null and !detail.note.isEmpty()}" th:text="'↳ ' + ${detail.note}"></div>
            </div>
          </li>
        </ul>
        <button class="btn-action btn-start" th:onclick="|updateStatus(${order.id}, 'Preparing')|" sec:authorize="hasAnyAuthority('OP_FNB_ORDER', 'ROLE_ADMIN', 'ROLE_MANAGER')">Start Cooking</button>
      </div>

    </div>

    <!-- PREPARING COLUMN -->
    <div class="kanban-col">
      <h2>Cooking</h2>

      <div class="order-card preparing" th:each="order : ${orders}" th:if="${order.orderStatus == 'Preparing'}">
        <div class="order-header">
          <span th:text="'Order #' + ${order.id}"></span>
          <span th:text="${order.orderType}"></span>
        </div>
        <div class="order-meta">
          <span th:text="${order.table != null ? 'Bàn ' + order.table.tableNumber : 'Room Service'}"></span>
        </div>
        
        <div class="order-general-note" th:if="${order.note != null and !order.note.isEmpty()}">
          <span class="material-symbols-outlined" style="font-size: 0.9rem; vertical-align: middle;">warning</span>
          <th:block th:if="${#strings.startsWith(order.note, 'GUEST:')}">
            <th:block th:with="pipeIndex=${#strings.indexOf(order.note, '|')}">
              <strong style="color: #b45309;" th:text="'Khách: ' + ${#strings.substring(order.note, 6, pipeIndex)}"></strong>
              <span th:if="${#strings.length(order.note) > pipeIndex + 1}" 
                    th:text="' - Note: ' + ${#strings.substring(order.note, pipeIndex + 1)}"></span>
            </th:block>
          </th:block>
          <th:block th:unless="${#strings.startsWith(order.note, 'GUEST:')}">
            <span th:text="'Note chung: ' + ${order.note}"></span>
          </th:block>
        </div>

        <ul class="order-items" th:id="'list-' + ${order.id}">
          <li th:each="detail : ${order.details}" th:if="${detail.kotStatus == 'Pending' || detail.kotStatus == 'Preparing'}" th:data-id="${detail.id}" onclick="toggleItem(this)">
            <div style="width: 100%; text-align: left;">
              <span th:text="${detail.quantity + 'x ' + (detail.menuItem != null ? detail.menuItem.itemName : 'Món')}"></span>
              <div class="item-note" th:if="${detail.note != null and !detail.note.isEmpty()}" th:text="'↳ ' + ${detail.note}"></div>
            </div>
          </li>
        </ul>
        <button th:id="'btn-ready-' + ${order.id}" class="btn-action btn-ready"
          th:onclick="|updateStatus(${order.id}, 'Ready')|" disabled sec:authorize="hasAnyAuthority('OP_FNB_ORDER', 'ROLE_ADMIN', 'ROLE_MANAGER')">Done</button>
      </div>

    </div>

      </div>
    </div>
  </div>

  <script th:src="@{/kitchenStaff/js/kitchen-dashboard.js}" src="../../statics/kitchenStaff/js/kitchen-dashboard.js"></script>
</body>

</html>
