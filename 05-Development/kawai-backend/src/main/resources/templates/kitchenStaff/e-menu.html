<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Menu — F&amp;B Staff | Hoanien Resort</title>
  <meta name="description" content="Danh sách thực đơn điện tử cho nhân viên F&amp;B — Hoanien Retreat Resort &amp; Hub" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

  <!-- E-Menu CSS -->
  <link rel="stylesheet" th:href="@{/kitchenStaff/css/e-menu.css}" href="../../statics/kitchenStaff/css/e-menu.css" />
</head>

<body>

  <!-- ============================================================
       SIDEBAR
       ============================================================ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="brand-name">HOANIEN</div>
      <div class="brand-sub">Resort &amp; Tour Hub</div>
      <div class="staff-badge">
        <span class="material-symbols-outlined" style="font-size:0.7rem;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;">restaurant</span>
        Kitchen Staff
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Vận hành</div>
      <a href="/kitchenStaff/kitchen" class="nav-item">
        <span class="material-symbols-outlined">kitchen</span>
        <span>KDS Dashboard</span>
      </a>
      <a href="/kitchenStaff/emenu" th:href="@{/kitchenStaff/emenu}" class="nav-item active">
        <span class="material-symbols-outlined">menu_book</span>
        <span>E-Menu</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="staff-profile">
        <div class="staff-avatar">KS</div>
        <div>
          <div class="staff-name" th:text="${staffName != null ? staffName : 'Nhân viên bếp'}">Nhân viên Bếp</div>
          <div class="staff-role">Nhà Bếp</div>
        </div>
        <button class="logout-btn" title="Đăng xuất" onclick="location.href='/auth/logout'">
          <span class="material-symbols-outlined" style="font-size:1.05rem;">logout</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- ============================================================
       MAIN CONTENT
       ============================================================ -->
  <div class="main-content">

    <!-- Topbar -->
    <header class="topbar">
      <div>
        <div class="topbar-title">E-Menu</div>
        <div class="topbar-subtitle">Thực đơn điện tử · Quản lý món ăn</div>
      </div>

      <div class="topbar-right">
        <div style="position:relative;">
          <div class="topbar-clock" id="live-clock">--:--:--</div>
          <div class="topbar-date" id="live-date" style="position:absolute;top:calc(100% + 3px);left:0;right:0;text-align:center;white-space:nowrap;"></div>
        </div>

        <div class="icon-btn" title="Thông báo">
          <span class="material-symbols-outlined">notifications</span>
        </div>

        <div class="icon-btn" title="Làm mới" onclick="renderMenu()">
          <span class="material-symbols-outlined">refresh</span>
        </div>

        <!-- View toggle (Grid/List) -->
        <button class="view-btn active" id="btn-grid-view" title="Grid view">
          <span class="material-symbols-outlined">grid_view</span>
        </button>
        <button class="view-btn" id="btn-list-view" title="List view">
          <span class="material-symbols-outlined">view_list</span>
        </button>
      </div>
    </header>

    <!-- E-Menu Body -->
    <div class="emenu-body">

      <!-- =========================================================
           CONTROLS BAR — Search + Category + Status
           ========================================================= -->
      <div class="controls-bar">

        <!-- Row 1: Search + Status filter -->
        <div class="search-row">
          <div class="search-box">
            <span class="material-symbols-outlined search-icon">search</span>
            <input
              type="text"
              id="menu-search"
              class="search-input"
              placeholder="Tìm kiếm tên món, danh mục..."
              autocomplete="off"
            />
          </div>

          <div style="display:flex;gap:6px;align-items:center;margin-left:8px;">
            <span style="font-size:0.62rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);font-weight:700;white-space:nowrap;">Trạng thái:</span>
            <div class="status-filter">
              <button class="filter-btn active" data-status="all">Tất cả</button>
              <button class="filter-btn" data-status="available">Còn món</button>
              <button class="filter-btn" data-status="out-of-stock">Hết món</button>
            </div>
          </div>
        </div>

        <!-- Row 2: Category pills + results count -->
        <div style="display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;">
          <div class="category-pills">
            <button class="cat-pill active" data-cat="all">
              Tất cả <span class="cat-count">0</span>
            </button>
            <button class="cat-pill" data-cat="starter">
              <span class="material-symbols-outlined" style="font-size:0.8rem;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;">set_meal</span>
              Khai vị <span class="cat-count">0</span>
            </button>
            <button class="cat-pill" data-cat="main">
              <span class="material-symbols-outlined" style="font-size:0.8rem;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;">outdoor_grill</span>
              Món chính <span class="cat-count">0</span>
            </button>
            <button class="cat-pill" data-cat="dessert">
              <span class="material-symbols-outlined" style="font-size:0.8rem;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;">cake</span>
              Tráng miệng <span class="cat-count">0</span>
            </button>
            <button class="cat-pill" data-cat="drink">
              <span class="material-symbols-outlined" style="font-size:0.8rem;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;">local_bar</span>
              Đồ uống <span class="cat-count">0</span>
            </button>
            <button class="cat-pill" data-cat="salad">
              <span class="material-symbols-outlined" style="font-size:0.8rem;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;">eco</span>
              Salad <span class="cat-count">0</span>
            </button>
          </div>

          <div class="results-info">
            <span>Hiển thị</span>
            <span class="results-count" id="results-count">0</span>
            <span>món</span>
          </div>
        </div>

      </div>
      <!-- / Controls Bar -->

      <!-- =========================================================
           MENU GRID  (populated by JS)
           ========================================================= -->
      <div class="menu-grid" id="menu-grid">
        <!-- Items rendered by e-menu.js -->
      </div>

    </div>
    <!-- / E-Menu Body -->

  </div>
  <!-- / Main Content -->

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- E-Menu JS -->
  <script th:inline="javascript">
    window.SERVER_MENU_ITEMS = /*[[${menuItems}]]*/ [];
  </script>
  <script th:src="@{/kitchenStaff/js/e-menu.js}" src="../../statics/kitchenStaff/js/e-menu.js"></script>

</body>
</html>
