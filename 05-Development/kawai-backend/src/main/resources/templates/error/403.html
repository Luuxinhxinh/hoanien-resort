<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Không có quyền truy cập - HOANIEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0f0d0c;
            color: #f1ebe3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Subtle ambient background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 30% 40%, rgba(139, 109, 59, 0.07) 0%, transparent 70%),
                radial-gradient(ellipse 40% 60% at 70% 60%, rgba(100, 70, 30, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .container {
            text-align: center;
            padding: 60px 40px;
            max-width: 520px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Lock icon */
        .lock-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(139,109,59,0.15) 0%, rgba(100,70,30,0.1) 100%);
            border: 1px solid rgba(139,109,59,0.3);
            margin-bottom: 32px;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(139,109,59,0.15); }
            50% { box-shadow: 0 0 0 16px rgba(139,109,59,0); }
        }

        .lock-icon {
            width: 44px;
            height: 44px;
            color: #c9a96e;
        }

        .error-code {
            font-family: 'Cormorant Garamond', serif;
            font-size: 96px;
            font-weight: 500;
            line-height: 1;
            color: transparent;
            background: linear-gradient(135deg, #c9a96e 0%, #8b6d3b 50%, #c9a96e 100%);
            -webkit-background-clip: text;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -2px;
        }

        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 500;
            color: #f1ebe3;
            margin-bottom: 16px;
            letter-spacing: 0.03em;
        }

        .description {
            font-size: 13.5px;
            font-weight: 300;
            color: rgba(241,235,227,0.55);
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .path-badge {
            display: inline-block;
            font-size: 11.5px;
            font-family: 'Courier New', monospace;
            color: #c9a96e;
            background: rgba(139,109,59,0.12);
            border: 1px solid rgba(139,109,59,0.25);
            border-radius: 6px;
            padding: 4px 12px;
            margin-bottom: 40px;
            letter-spacing: 0.03em;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: 0.05em;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #c9a96e 0%, #8b6d3b 100%);
            color: #0f0d0c;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(139,109,59,0.35);
        }

        .btn-ghost {
            background: transparent;
            color: rgba(241,235,227,0.6);
            border: 1px solid rgba(241,235,227,0.12);
        }
        .btn-ghost:hover {
            background: rgba(241,235,227,0.06);
            color: #f1ebe3;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139,109,59,0.4), transparent);
            margin: 0 auto 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lock-wrap">
            <!-- Lock SVG icon -->
            <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>

        <div class="error-code">403</div>
        <div class="divider"></div>
        <div class="title">Truy cập bị hạn chế</div>
        <p class="description">
            Tài khoản của bạn không có quyền truy cập trang này.<br>
            Vui lòng liên hệ quản trị viên để được cấp quyền phù hợp.
        </p>

        <div class="path-badge" th:if="${requestUri != null}" th:text="${requestUri}"></div>

        <div class="actions">
            <a href="javascript:history.back()" class="btn btn-ghost">
                ← Quay lại
            </a>
            <a href="/admin/dashboard" class="btn btn-primary">
                Về Dashboard
            </a>
        </div>
    </div>
</body>
</html>
