<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - HOANIEN Retreat & Resort</title>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfcfc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .reset-card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .brand {
            font-family: 'EB Garamond', serif;
            font-size: 32px;
            font-style: italic;
            color: #d4af37;
            margin-bottom: 20px;
        }
        .form-control {
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #d4af37;
        }
        .btn-primary {
            background-color: #1a1a1a;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
            width: 100%;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background-color: #333;
        }
        .text-muted {
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="reset-card">
    <div class="brand">Hòa Niên</div>
    <h4 class="mb-2" style="font-weight: 600;">Thiết lập mật khẩu mới</h4>
    <p class="text-muted mb-4">Vui lòng nhập mật khẩu mới cho tài khoản của bạn.</p>

    <form id="resetPasswordForm">
        <input type="hidden" id="token" name="token" th:value="${token}">
        
        <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="Mật khẩu mới (ít nhất 6 ký tự)" required>
        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Xác nhận mật khẩu mới" required>
        
        <button type="submit" class="btn btn-primary mt-2" id="submitBtn">ĐẶT LẠI MẬT KHẨU</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script>
    document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const token = document.getElementById('token').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const submitBtn = document.getElementById('submitBtn');

        if (newPassword !== confirmPassword) {
            Toastify({ text: "Mật khẩu xác nhận không khớp!", backgroundColor: "#dc3545", duration: 3000 }).showToast();
            return;
        }
        if (newPassword.length < 6) {
            Toastify({ text: "Mật khẩu phải có ít nhất 6 ký tự!", backgroundColor: "#dc3545", duration: 3000 }).showToast();
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = "ĐANG XỬ LÝ...";

        const formData = new URLSearchParams();
        formData.append('token', token);
        formData.append('newPassword', newPassword);
        formData.append('confirmPassword', confirmPassword);

        fetch('/api/v1/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                Toastify({ text: "Đổi mật khẩu thành công! Đang chuyển hướng...", backgroundColor: "#28a745", duration: 2000 }).showToast();
                setTimeout(() => {
                    window.location.href = '/booking?login=true';
                }, 1500);
            } else {
                Toastify({ text: data.message || "Có lỗi xảy ra, vui lòng thử lại.", backgroundColor: "#dc3545", duration: 3000 }).showToast();
                submitBtn.disabled = false;
                submitBtn.innerHTML = "ĐẶT LẠI MẬT KHẨU";
            }
        })
        .catch(err => {
            Toastify({ text: "Lỗi kết nối máy chủ.", backgroundColor: "#dc3545", duration: 3000 }).showToast();
            submitBtn.disabled = false;
            submitBtn.innerHTML = "ĐẶT LẠI MẬT KHẨU";
        });
    });
</script>

</body>
</html>
