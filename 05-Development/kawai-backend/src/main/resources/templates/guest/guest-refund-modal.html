<div id="guestRefundModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
  <div class="refund-modal-content">
    <div class="refund-modal-header">
      <h3 id="guestRefundModalTitle">Yêu cầu thông tin hoàn tiền</h3>
      <button type="button" onclick="closeGuestRefundModal()" class="btn-close">&times;</button>
    </div>
    <div class="refund-modal-body">
      <p id="guestRefundModalDesc" style="margin-bottom: 15px; color: var(--text-secondary); font-size: 0.9rem;">
        Đơn hàng này đã được thanh toán trực tuyến. Vui lòng cung cấp thông tin tài khoản ngân hàng để Kế toán tiến hành hoàn tiền.
      </p>
      <!-- Tour refund amount banner (hidden by default, shown for TOUR type) -->
      <div id="guestRefundTourBanner" style="display:none;"></div>
      <form id="guestRefundForm" onsubmit="submitGuestRefundForm(event)">
        <input type="hidden" id="guestRefundOrderId" name="orderId">
        
        <div class="form-group">
          <label>Ngân hàng / Ví điện tử <span class="text-danger">*</span></label>
          <input type="text" id="guestRefundBankName" required placeholder="VD: Vietcombank, MoMo...">
        </div>
        
        <div class="form-group">
          <label>Số tài khoản <span class="text-danger">*</span></label>
          <input type="text" id="guestRefundAccountNumber" required placeholder="Nhập số tài khoản...">
        </div>
        
        <div class="form-group">
          <label>Tên chủ tài khoản <span class="text-danger">*</span></label>
          <input type="text" id="guestRefundAccountName" required placeholder="NHAP TEN KHONG DAU">
        </div>
        
        <div class="form-group">
          <label>Số điện thoại liên hệ</label>
          <input type="text" id="guestRefundPhoneNumber" placeholder="Số điện thoại của bạn...">
        </div>
        
        <div class="refund-modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeGuestRefundModal()" style="padding: 10px 20px; border-radius: 6px; border: 1px solid #ddd; background: transparent; cursor: pointer;">Hủy bỏ</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-guest-refund" style="padding: 10px 20px; border-radius: 6px; border: none; background-color: #d32f2f; color: white; cursor: pointer;">Gửi Yêu cầu Hủy đơn</button>
        </div>
      </form>
    </div>
  </div>
</div>
