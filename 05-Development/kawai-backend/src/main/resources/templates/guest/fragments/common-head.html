<th:block th:fragment="head">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'hoanien-bg': '#f1ebe3',
                        'hoanien-text': '#3a3230',
                        'hoanien-footer': '#3c3530',
                        'hoanien-footer-text': '#e5dfd8'
                    },
                    fontFamily: {
                        'serif': ['"Playfair Display"', 'serif'],
                        'sans': ['"Montserrat"', 'sans-serif'],
                        "headline": ["EB Garamond", "serif"],
                        "body": ["Inter", "sans-serif"],
                    },
                    spacing: { 'section-y': '120px' }
                }
            }
        }
    </script>

    <!-- Clear Cart on Logout Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const logoutForms = document.querySelectorAll('form[action*="/auth/logout"]');
            logoutForms.forEach(form => {
                form.addEventListener('submit', function() {
                    sessionStorage.removeItem('kawai_cart');
                    sessionStorage.removeItem('kawai_bookingState');
                });
            });
        });
    </script>
</th:block>
