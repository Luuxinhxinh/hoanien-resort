<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.th3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoaNien · Đặt lại mật khẩu</title>
    <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('/guest/BrAdmin.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: rgba(18, 16, 15, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(201, 169, 110, 0.20);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #C9A96E;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .brand h1 {
            font-family: 'EB Garamond', Georgia, serif !important;
            font-style: italic;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.05em;
            color: #ffffff;
            margin: 0 0 6px;
            text-transform: none !important;
        }

        .brand p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
        }

        h2 {
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-size: 24px;
            color: #ffffff;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(44, 42, 30, 0.12);
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            background: #FDFBF7;
            color: #12100f;
        }

        input:focus {
            outline: none;
            border-color: #C9A96E;
            box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.15);
            background: white;
        }

        .password-hint {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 6px;
            line-height: 1.4;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #8C6A41;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            box-shadow: 0 2px 4px rgba(140, 106, 65, 0.15);
        }

        .btn-submit:hover {
            background: #8C6A41;
            opacity: 0.88;
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.65);
        }

        .back-link a {
            color: #C9A96E;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .back-link a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .alert-success {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #166534;
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }
    </style>
</head>

<body>
    <div class="reset-container">
        <div class="brand">
            <div class="brand-dot">◆</div>
            <h1>HoaNien</h1>
            <p>Retreat Resort & Hub</p>
        </div>

        <h2>Đặt lại mật khẩu</h2>
        <p class="subtitle">Nhập mật khẩu mới cho tài khoản của bạn</p>

        <!-- Flash Messages -->
        <div th:if="${authSuccess}" class="alert alert-success" role="alert">
            <span th:text="${authSuccess}"></span>
        </div>
        <div th:if="${authError}" class="alert alert-error" role="alert">
            <span th:text="${authError}"></span>
        </div>

        <form th:action="@{/auth/reset-password}" method="post" class="space-y-4">
            <input type="hidden" name="token" th:value="${param.token}">

            <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <input type="password" id="newPassword" name="newPassword" required placeholder="Nhập mật khẩu mới"
                    class="w-full border border-hoanien-text/20 p-3 focus:ring-1 focus:ring-hoanien-text focus:border-hoanien-text bg-white text-sm">
                <p class="password-hint">
                    Mật khẩu phải có ít nhất 8 ký tự, chứa chữ hoa, chữ thường và số.
                </p>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                    placeholder="Nhập lại mật khẩu mới"
                    class="w-full border border-hoanien-text/20 p-3 focus:ring-1 focus:ring-hoanien-text focus:border-hoanien-text bg-white text-sm">
            </div>

            <button type="submit"
                class="btn-submit w-full bg-hoanien-text text-white py-3 text-[11px] uppercase tracking-[0.15em] font-semibold hover:bg-hoanien-text/80 active:scale-[0.98] active:translate-y-[0.5px] transition-all duration-200 transition-colors">
                Đặt lại mật khẩu
            </button>
        </form>

        <div class="back-link">
            <a href="/ops-login">← Quay lại đăng nhập</a>
        </div>
    </div>

    <script>
        // Client-side validation
        document.querySelector('form').addEventListener('submit', function (e) {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                e.preventDefault();
                alert('Mật khẩu xác nhận không khớp!');
                return false;
            }

            if (newPassword.length < 8) {
                e.preventDefault();
                alert('Mật khẩu phải có ít nhất 8 ký tự!');
                return false;
            }
        });
    </script>
</body>

</html>
