<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.th3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực OTP - Hoanien Retreat Resort</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f0e8 0%, #e8dfd3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .otp-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-dot {
            width: 48px;
            height: 48px;
            background: #8B5E3C;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #2c2416;
            font-weight: 600;
        }

        .brand p {
            font-size: 13px;
            color: #8B7355;
            margin-top: 4px;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #2c2416;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #8B7355;
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #5c4a32;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d4c4b0;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            background: #faf8f5;
        }

        input:focus {
            outline: none;
            border-color: #8B5E3C;
            box-shadow: 0 0 0 3px rgba(139, 94, 60, 0.1);
            background: white;
        }

        .otp-input {
            text-align: center;
            font-size: 24px;
            letter-spacing: 8px;
            font-weight: 600;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #8B5E3C;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #6d4c31;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 94, 60, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-resend {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #8B5E3C;
            border: 1px solid #8B5E3C;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
        }

        .btn-resend:hover {
            background: #8B5E3C;
            color: white;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #8B7355;
        }

        .back-link a {
            color: #8B5E3C;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .alert-success {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #166534;
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }

        .otp-info {
            background: #f5f0e8;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #5c4a32;
            line-height: 1.6;
        }

        .otp-info strong {
            color: #8B5E3C;
        }
    </style>
</head>

<body>
    <div class="otp-container">
        <div class="brand">
            <div class="brand-dot">◆</div>
            <h1>HOANIEN</h1>
            <p>Retreat Resort & Hub</p>
        </div>

        <h2>Xác thực OTP</h2>
        <p class="subtitle">Nhập mã OTP đã được gửi đến email của bạn</p>

        <!-- Flash Messages -->
        <div th:if="${authSuccess}" class="alert alert-success" role="alert">
            <span th:text="${authSuccess}"></span>
        </div>
        <div th:if="${authError}" class="alert alert-error" role="alert">
            <span th:text="${authError}"></span>
        </div>

        <div class="otp-info">
            <strong>📧 Mã OTP đã được gửi!</strong><br>
            Vui lòng kiểm tra email của bạn. Mã OTP có hiệu lực trong <strong>10 phút</strong>.
        </div>

        <form th:action="@{/auth/verify-otp}" method="post" class="space-y-4">
            <input type="hidden" name="username" th:value="${param.username}">

            <div class="form-group">
                <label for="otpCode">Mã OTP (6 số)</label>
                <input type="text" id="otpCode" name="otpCode" required placeholder="123456" maxlength="6"
                    class="otp-input w-full border border-hoanien-text/20 p-3 focus:ring-1 focus:ring-hoanien-text focus:border-hoanien-text bg-white text-sm">
            </div>

            <button type="submit"
                class="btn-submit w-full bg-hoanien-text text-white py-3 text-[11px] uppercase tracking-[0.15em] font-semibold hover:bg-hoanien-text/80 active:scale-[0.98] active:translate-y-[0.5px] transition-all duration-200 transition-colors">
                Xác thực
            </button>
        </form>

        <form th:action="@{/auth/resend-otp}" method="get" class="space-y-4">
            <input type="hidden" name="username" th:value="${param.username}">
            <button type="submit" class="btn-resend">
                Gửi lại mã OTP
            </button>
        </form>

        <div class="back-link">
            <a href="/auth/login">← Quay lại đăng nhập</a>
        </div>
    </div>

    <script>
        // Auto-focus OTP input
        document.getElementById('otpCode').focus();

        // Only allow numbers
        document.getElementById('otpCode').addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>

</html>
